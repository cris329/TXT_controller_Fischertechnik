<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUTBALLROBOTER</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/theme.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/css/layout.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/css/pad.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/css/pad-fx.css?v={{ asset_v }}">
</head>
<body>
  <div class="shell">
    <header class="bar">
      <div class="brand">
        <div class="mark">F</div>
        <div>
          <h1>FUTBALLROBOTER</h1>
          <p>CONTROL · EXPLORA · JUEGA</p>
        </div>
      </div>
      <div class="chips">
        <div class="chip" id="pill-live"><i class="led"></i><span id="live">…</span></div>
        <div class="chip" id="host">{{ host }}</div>
        <div class="chip">XBOX <span id="xbox">{{ 'SI' if xbox else 'NO' }}</span></div>
      </div>
    </header>

    <section class="cam">
      <div class="cam-frame">
        <span class="hud-tag">CAM 1</span>
        <span class="hud-tag right" id="cam-hb">HB —</span>
          <img id="feed" src="/camera.jpg" alt="Cámara">
      </div>
    </section>

    <footer class="pad">
      <button type="button" tabindex="-1" id="restart" class="tile tile-restart">
        <span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></span>
        <span class="tile-txt"><span class="tile-eyebrow">SISTEMA</span><b>REINICIAR TXT</b><small>Limpia el contenido del archivo</small></span>
        <span class="tile-chev">›</span>
        <span class="tile-foot"><i></i>Requiere conexión con la TXT</span>
      </button>

      <div class="dpad" role="group" aria-label="Movimiento">
        <button type="button" tabindex="-1" class="dkey up" data-vx="1" data-vy="0" data-omega="0" aria-label="Avanzar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
        <button type="button" tabindex="-1" class="dkey left" data-vx="0" data-vy="0" data-omega="-1" aria-label="Girar izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
        <button type="button" tabindex="-1" class="dkey right" data-vx="0" data-vy="0" data-omega="1" aria-label="Girar derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
        <button type="button" tabindex="-1" class="dkey down" data-vx="-1" data-vy="0" data-omega="0" aria-label="Retroceder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
      </div>

      <div class="actions">
        <button type="button" tabindex="-1" id="kick" class="tile tile-kick">
          <span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V6.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 12V9.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1.2a6 6 0 0 1-4.8-2.4L5.2 13.8a1.6 1.6 0 0 1 2.6-1.9L9 13"/></svg></span>
          <span class="tile-txt"><span class="tile-eyebrow">JUEGO</span><b>EMPUJAR</b><small>Activa el empuje del robot</small></span>
          <span class="tile-chev">›</span>
        </button>

        <button type="button" tabindex="-1" id="sound" class="tile tile-sound">
          <span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 3V7L7 10H4z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.5 6.5a7 7 0 0 1 0 11"/></svg></span>
          <span class="tile-txt"><span class="tile-eyebrow">AUDIO</span><b>SONIDO</b><small>Haz sonar al robot</small></span>
          <span class="tile-chev">›</span>
        </button>
      </div>
    </footer>
  </div>
  <script src="/static/js/controls.js?v={{ asset_v }}"></script>
  <script src="/static/js/keyboard.js?v={{ asset_v }}"></script>
  <script src="/static/js/pad-fx.js?v={{ asset_v }}"></script>
</body>
</html>
